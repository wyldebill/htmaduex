workflows:
  mapme-mobile:
    name: Mapme Mobile
    environment:
      flutter: stable
    scripts:
      - name: Materialize local secret files
        script: |
          cat > .env <<EOF
          GOOGLE_MAPS_API_KEY="${GOOGLE_MAPS_API_KEY}"
  
          EOF
          chmod +x tool/sync_secrets.sh
          ./tool/sync_secrets.sh .env
      - name: Install dependencies
        script: flutter pub get
      - name: Run tests
        script: flutter test
      - name: Build Android
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
